name: Site

# Rebuilds the landing page and documentation whenever the site changes.
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "Site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    uses: T2PeNBiX99wcoxKv3A4g/Release-Workflows/.github/workflows/web_pages.yml@main
    with:
      working_directory: Site
      # No lockfile is committed, so `npm install` and no dependency cache.
      install_command: npm install
      cache_dependency_path: ''
    secrets: inherit
