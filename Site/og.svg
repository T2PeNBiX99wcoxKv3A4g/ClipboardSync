<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
    <title id="title">ClipboardSync</title>
    <desc id="desc">Copy once, paste on every device you own.</desc>

    <defs>
        <radialGradient id="glow-top" cx="18%" cy="-10%" r="75%">
            <stop offset="0" stop-color="#ff6b3d" stop-opacity="0.38"/>
            <stop offset="1" stop-color="#ff6b3d" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glow-bottom" cx="95%" cy="110%" r="70%">
            <stop offset="0" stop-color="#ff6b6b" stop-opacity="0.28"/>
            <stop offset="1" stop-color="#ff6b6b" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="icon-bg" x1="8" y1="8" x2="248" y2="248" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#ff3d6e"/>
            <stop offset="1" stop-color="#ff9a3d"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="630" fill="#0a0908"/>
    <rect width="1200" height="630" fill="url(#glow-top)"/>
    <rect width="1200" height="630" fill="url(#glow-bottom)"/>

    <rect x="24" y="24" width="1152" height="582" rx="28" fill="none"
          stroke="#ff8a3d" stroke-opacity="0.16" stroke-width="2"/>

    <!-- The app mark, scaled from icon.svg. -->
    <g transform="translate(90 205) scale(0.86)">
        <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#icon-bg)"/>
        <rect x="66" y="52" width="124" height="156" rx="22" fill="#fff8f0"/>
        <rect x="102" y="36" width="52" height="30" rx="12" fill="#ffd166"/>
        <path d="M82 112h78" stroke="#ff6b3d" stroke-width="14" stroke-linecap="round"/>
        <path d="M158 88l28 24-28 24z" fill="#ff6b3d"/>
        <path d="M174 152H96" stroke="#ff6b3d" stroke-width="14" stroke-linecap="round"/>
        <path d="M98 128 70 152l28 24z" fill="#ff6b3d"/>
    </g>

    <g font-family="Segoe UI, Arial, sans-serif">
        <text x="360" y="306" fill="#fff8f0" font-size="92" font-weight="700" letter-spacing="-3">ClipboardSync</text>
        <text x="364" y="374" fill="#c6b6a6" font-size="32">Copy once, paste on every device you own.</text>
        <text x="364" y="432" fill="#806e5d" font-size="23" letter-spacing="0.4">Encrypted clipboard sharing</text>
    </g>

    <text x="1110" y="570" fill="#806e5d" font-family="Cascadia Mono, Consolas, monospace"
          font-size="19" text-anchor="end">t2penbix99wcoxkv3a4g.github.io/ClipboardSync</text>
</svg>
